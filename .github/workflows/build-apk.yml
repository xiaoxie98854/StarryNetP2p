name: Build StarryNet Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build unsigned release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      # AGP 8.5 产出的 APK 里 resources.arsc 未做 4 字节对齐，Android 11+ 会拒装。
      # 正确顺序：先 zipalign 对齐未签名包 → 再 apksigner 签名 → verify 校验。
      # build-tools 37 的 apksigner 会丢掉对齐 padding，这里固定用 35.0.0（稳定版）。
      - name: Zipalign + Sign + Verify
        id: apk
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/35.0.0"
          if [ ! -x "$BT/apksigner" ]; then
            BT=$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | head -1)
          fi
          echo "build-tools: $BT"

          UN=$(find app/build/outputs/apk/release -name '*-unsigned.apk' | head -1)
          if [ -z "$UN" ]; then
            UN=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          fi
          echo "unsigned apk: $UN"

          OUT=app/build/outputs/apk/release/app-release.apk
          rm -f "$OUT"

          echo "== zipalign (4-byte align) =="
          "$BT/zipalign" -p -f -v 4 "$UN" app/build/outputs/apk/release/aligned.apk

          echo "== apksigner (v2 + v3; v1 off to preserve alignment) =="
          # v1 签名会往 ZIP 里插 META-INF 条目，破坏 zipalign 的对齐；
          # minSdk 24 已支持 v2 签名，故关闭 v1，只用 v2+v3。
          "$BT/apksigner" sign \
            --ks app/starrynet-release.jks \
            --ks-pass pass:starrynet123 \
            --key-pass pass:starrynet123 \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" \
            app/build/outputs/apk/release/aligned.apk

          echo "== apksigner verify =="
          "$BT/apksigner" verify --verbose --print-certs "$OUT"

          echo "== post-sign alignment check =="
          python3 - "$OUT" <<'PY'
          import sys, zipfile
          p=sys.argv[1]
          z=zipfile.ZipFile(p)
          i=z.getinfo('resources.arsc')
          off=i.header_offset+30+len(i.filename.encode())+len(i.extra)
          print(f'resources.arsc {"STORED" if i.compress_type==0 else "DEFLATE"} offset={off} mod4={off%4} extra={len(i.extra)}')
          assert i.compress_type==0 and off%4==0, 'resources.arsc NOT aligned!'
          print('ALIGNMENT OK')
          PY

          echo "path=android/$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StarryNet-Android-DEBUG
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarryNet-Android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90
