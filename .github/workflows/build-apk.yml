name: Build StarryNet Android APK

# 手动触发：在 Actions 页面点 Run workflow。代码推上去后也可自动触发。
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build unsigned release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      # 关键：AGP 8.5 默认产出的 APK 里 resources.arsc 未做 4 字节对齐，
      # Android 11+ 会直接拒装（INSTALL_FAILED_INVALID_APK）。
      # 这里显式「先 zipalign 对齐 → 再 apksigner 签名」，顺序不能反。
      - name: Zipalign + Sign + Verify
        id: apk
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          echo "build-tools: $BT"

          UN=$(find app/build/outputs/apk/release -name '*-unsigned.apk' | head -1)
          if [ -z "$UN" ]; then
            UN=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          fi
          echo "unsigned apk: $UN"

          OUT=app/build/outputs/apk/release/app-release.apk
          rm -f "$OUT"

          echo "== zipalign (4-byte align) =="
          "$BT/zipalign" -p -f -v 4 "$UN" app/build/outputs/apk/release/aligned.apk

          echo "== apksigner (v1 + v2 + v3) =="
          "$BT/apksigner" sign \
            --ks app/starrynet-release.jks \
            --ks-pass pass:starrynet123 \
            --key-pass pass:starrynet123 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT" \
            app/build/outputs/apk/release/aligned.apk

          echo "== apksigner verify =="
          "$BT/apksigner" verify --verbose --print-certs "$OUT"

          echo "== post-sign alignment check =="
          python3 - "$OUT" <<'PY'
          import sys, zipfile
          p=sys.argv[1]
          z=zipfile.ZipFile(p)
          i=z.getinfo('resources.arsc')
          off=i.header_offset+30+len(i.filename.encode())+len(i.extra)
          ctype='STORED' if i.compress_type==0 else 'DEFLATE'
          print(f'resources.arsc {ctype} offset={off} mod4={off%4}')
          assert i.compress_type==0 and off%4==0, 'resources.arsc NOT aligned!'
          print('ALIGNMENT OK')
          PY

          echo "path=android/$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarryNet-Android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90
