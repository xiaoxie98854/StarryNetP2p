name: Build StarryNet Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 隧道程序：直接用 frp 官方发布的 **android_arm64** 预编译包。
      # 官方自 0.6x 起就提供 Android 目标，用 NDK 交叉编译，比通用 linux/arm64
      # 更贴合 Android 的 bionic libc 与 syscall 白名单，避免被 seccomp 拦截。
      #
      # 命名成 libfrpc.so + 放进 jniLibs，安装后会被解压到 nativeLibraryDir
      # —— Android 10+ 里唯一允许 exec 的目录（应用数据目录已禁执行）。
      #
      # 不从源码 go build：frp 0.6x 起 frpc 内嵌 Web UI，源码缺 web/frpc/dist
      # 前端产物会直接编译失败，官方包已经带好了。
      # 版本必须与桌面端 client/frpc/frpc.exe (0.72.0) 及服务端 frps 对齐。
      - name: Fetch frpc for Android arm64
        working-directory: /tmp
        run: |
          set -euo pipefail
          VER=0.72.0
          URL="https://github.com/fatedier/frp/releases/download/v${VER}/frp_${VER}_android_arm64.tar.gz"
          curl -fsSL --retry 3 -o frp.tar.gz "$URL"
          tar -xzf frp.tar.gz
          OUT="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$OUT"
          cp "frp_${VER}_android_arm64/frpc" "$OUT/libfrpc.so"
          chmod +x "$OUT/libfrpc.so"
          ls -lh "$OUT/libfrpc.so"
          file "$OUT/libfrpc.so"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # AGP 自动 zipalign + 用 signingConfig 做 v1+v2+v3 签名。
      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify + package
        id: apk
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/34.0.0"
          [ -x "$BT/apksigner" ] || BT=$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk

          echo "== bundled tunnel binary =="
          unzip -l "$APK" | grep -i 'libfrpc.so'

          echo "== signature =="
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          echo "== META-INF =="
          unzip -l "$APK" | grep -E 'CERT|MANIFEST' || true

          echo "== alignment (local header view) =="
          python3 - "$APK" <<'PY'
          import sys, struct, zipfile
          raw=open(sys.argv[1],'rb').read(); z=zipfile.ZipFile(sys.argv[1])
          i=z.getinfo('resources.arsc'); ho=i.header_offset
          off=ho+30+struct.unpack_from('<H',raw,ho+26)[0]+struct.unpack_from('<H',raw,ho+28)[0]
          print(f'resources.arsc ctype={i.compress_type} dataoff={off} mod4={off%4}')
          assert i.compress_type==0 and off%4==0, 'NOT aligned'
          print('ALIGNMENT OK')
          PY
          echo "path=android/$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarryNet-Android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90
