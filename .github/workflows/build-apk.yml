name: Build StarryNet Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # AGP 在 assembleRelease 时会自动 zipalign（对齐已验证正常）并按
      # signingConfig 签名。v1/v2/v3 全开以兼容新旧国产 ROM。
      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        id: apk
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$SDK/build-tools/34.0.0"
          if [ ! -x "$BT/apksigner" ]; then
            BT=$(find "$SDK/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          fi
          APK=app/build/outputs/apk/release/app-release.apk
          echo "build-tools: $BT"
          echo "apk: $APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          echo "path=android/$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarryNet-Android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90
