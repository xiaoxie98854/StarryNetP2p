apply plugin: 'com.android.application'

android {
    namespace 'top.starrynet.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'top.starrynet.mobile'
        minSdk 24
        targetSdk 34
        // 1.1.0 起内置 frpc 隧道，手机端可以自己开房。
        // versionCode 必须比 1.0.0 大，已装旧版的用户才能直接覆盖安装、不丢登录状态。
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            storeFile file('starrynet-release.jks')
            storePassword 'starrynet123'
            keyAlias 'starrynet'
            keyPassword 'starrynet123'
            // v1+v2+v3 全开，最大兼容国产 ROM 与新旧系统
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 隧道程序 libfrpc.so 必须真正解压到 nativeLibraryDir 才能执行（详见 AndroidManifest 注释）
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            // 别让 AGP 用 NDK 的 strip 处理它：这是 Go 编译出来的完整可执行文件，
            // 不是共享库，被 strip 会直接损坏
            keepDebugSymbols.add("**/libfrpc.so")
        }
    }

    // APK 里带 ~20MB 的 frpc，压缩后仍然偏大，但这是开房功能的前提。
    // 关掉 aapt 对 so 的压缩优化会让体积更大，所以保持默认压缩。
}

// 零第三方依赖：网络用 HttpURLConnection，UI 用系统控件。
dependencies {
}
