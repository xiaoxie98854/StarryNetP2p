apply plugin: 'com.android.application'

android {
    namespace 'top.starrynet.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'top.starrynet.mobile'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file('starrynet-release.jks')
            storePassword 'starrynet123'
            keyAlias 'starrynet'
            keyPassword 'starrynet123'
            // v1+v2+v3 全开，最大兼容国产 ROM 与新旧系统
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 零第三方依赖：网络用 HttpURLConnection，UI 用系统控件。
dependencies {
}
