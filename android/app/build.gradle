apply plugin: 'com.android.application'

android {
    namespace 'top.starrynet.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'top.starrynet.mobile'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    // 签名统一交给 CI 的 apksigner（v1+v2），这里不签名，产出 unsigned APK。
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 零第三方依赖：网络用 HttpURLConnection，UI 用系统控件。
dependencies {
}
