apply plugin: 'com.android.application'

android {
    namespace 'top.starrynet.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'top.starrynet.mobile'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    // 签名不在 AGP 内做：改由 CI 流水线先 zipalign（4 字节对齐）再 apksigner 签名。
    // AGP 8.5 默认产出的 APK 里 resources.arsc 未对齐，Android 11+ 会直接拒装
    // （INSTALL_FAILED_INVALID_APK /「系统内部问题导致安装失败」）。
    // 先对齐后签名是 Android 官方要求，顺序不能反。
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 零第三方依赖：网络用 HttpURLConnection，UI 用系统控件。
dependencies {
}
