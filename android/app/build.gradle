apply plugin: 'com.android.application'

android {
    namespace 'top.starrynet.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'top.starrynet.mobile'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        // 内测固定签名：密钥随仓库保存，保证每次编译签名一致，
        // 用户后续更新能直接覆盖安装（不会因为签名不同被系统拒绝）。
        release {
            storeFile file('starrynet-release.jks')
            storePassword 'starrynet123'
            keyAlias 'starrynet'
            keyPassword 'starrynet123'
            // 国产 ROM（荣耀/MagicOS、MIUI 等）对纯 v3 签名兼容性差，
            // 常报「系统内部问题导致安装失败」。强制 v1+v2、关闭 v3 以最大兼容。
            enableV1Signing true
            enableV2Signing true
            enableV3Signing false
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 零第三方依赖：网络用 HttpURLConnection，UI 用系统控件。
dependencies {
}
