apply plugin: 'com.android.application'

android {
    namespace 'top.starrynet.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'top.starrynet.mobile'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        // 内测固定签名：密钥随仓库保存，保证每次编译签名一致，
        // 用户后续更新能直接覆盖安装（不会因为签名不同被系统拒绝）。
        // 这是自签内测密钥，不是 Play 上架密钥。
        release {
            storeFile file('starrynet-release.jks')
            storePassword 'starrynet123'
            keyAlias 'starrynet'
            keyPassword 'starrynet123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 零第三方依赖：网络用 HttpURLConnection，UI 用系统控件。
dependencies {
}
